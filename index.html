<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>跨资产仪表盘</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --panel: #ffffff;
      --line: #d8dde6;
      --text: #172033;
      --muted: #667085;
      --good: #087443;
      --watch: #a15c07;
      --risk: #b42318;
      --blue: #175cd3;
      --ink: #101828;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }
    .wrap {
      width: min(1280px, calc(100vw - 32px));
      margin: 0 auto;
    }
    .topbar {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: 0;
    }
    .sub {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }
    button {
      border: 1px solid #98a2b3;
      background: #fff;
      color: var(--ink);
      height: 36px;
      padding: 0 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: #f2f4f7; }
    main { padding: 22px 0 40px; }
    .summary {
      display: grid;
      grid-template-columns: minmax(260px, 0.9fr) minmax(360px, 1.4fr);
      gap: 16px;
      align-items: stretch;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
    }
    .regime {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    .regime strong { font-size: 26px; }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 3px 10px;
      border-radius: 999px;
      font-weight: 700;
      white-space: nowrap;
      border: 1px solid transparent;
    }
    .badge.neutral { color: var(--blue); background: #eff4ff; border-color: #b2ccff; }
    .badge.opportunity { color: var(--good); background: #ecfdf3; border-color: #abefc6; }
    .badge.watch { color: var(--watch); background: #fffaeb; border-color: #fedf89; }
    .badge.risk, .badge.extreme { color: var(--risk); background: #fef3f2; border-color: #fecdca; }
    .action {
      font-size: 16px;
      margin: 0 0 10px;
    }
    .meta {
      color: var(--muted);
      font-size: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .signals {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .signals h2 {
      font-size: 14px;
      margin: 0 0 8px;
    }
    ul {
      margin: 0;
      padding-left: 18px;
    }
    li { margin: 5px 0; }
    .grid {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(4, minmax(180px, 1fr));
      gap: 12px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      min-height: 140px;
    }
    .card h3 {
      margin: 0 0 8px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
    }
    .value {
      font-size: 25px;
      line-height: 1.1;
      font-weight: 800;
      color: var(--ink);
    }
    .delta {
      margin-top: 8px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 12px;
    }
    .interp {
      margin-top: 10px;
      color: #344054;
      font-size: 13px;
    }
    .table-panel { margin-top: 16px; padding: 0; overflow: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 980px;
    }
    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }
    th {
      font-size: 12px;
      color: var(--muted);
      background: #f9fafb;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .pos { color: var(--good); font-weight: 650; }
    .neg { color: var(--risk); font-weight: 650; }
    .muted { color: var(--muted); }
    .error {
      margin-top: 16px;
      color: var(--risk);
      background: #fef3f2;
      border: 1px solid #fecdca;
      border-radius: 8px;
      padding: 12px;
      display: none;
    }
    @media (max-width: 980px) {
      .summary { grid-template-columns: 1fr; }
      .grid { grid-template-columns: repeat(2, minmax(170px, 1fr)); }
    }
    @media (max-width: 620px) {
      .wrap { width: min(100vw - 20px, 1280px); }
      .topbar { align-items: flex-start; flex-direction: column; padding: 14px 0; }
      .signals { grid-template-columns: 1fr; }
      .grid { grid-template-columns: 1fr; }
      h1 { font-size: 21px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap topbar">
      <div>
        <h1>跨资产仪表盘</h1>
        <div class="sub">VIX、Fear & Greed、市场广度、信用市场、利率、美元、黄金</div>
      </div>
      <button id="refresh">刷新数据</button>
    </div>
  </header>

  <main class="wrap">
    <section class="summary">
      <div class="panel">
        <div class="regime">
          <strong id="regime">载入中</strong>
          <span id="tone" class="badge neutral">等待数据</span>
        </div>
        <p id="action" class="action">正在抓取公共市场数据。</p>
        <div class="meta">
          <span id="updated">更新时间：-</span>
          <span>自动刷新：5 分钟</span>
        </div>
      </div>
      <div class="panel signals">
        <div>
          <h2>风险提示</h2>
          <ul id="flags"><li class="muted">暂无</li></ul>
        </div>
        <div>
          <h2>机会信号</h2>
          <ul id="positives"><li class="muted">暂无</li></ul>
        </div>
      </div>
    </section>

    <section id="cards" class="grid"></section>

    <section class="panel table-panel">
      <table>
        <thead>
          <tr>
            <th>指标</th>
            <th>最新值</th>
            <th>1 日</th>
            <th>5 日</th>
            <th>解释</th>
            <th>数据源 / 日期</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </section>

    <div id="error" class="error"></div>
  </main>

  <script>
    const order = [
      "vix", "fear_greed", "rsp_spy", "iwm_spy",
      "hyg", "jnk", "hy_spread", "tnx",
      "dxy", "gold"
    ];

    const labels = {
      vix: "VIX",
      fear_greed: "Fear & Greed",
      rsp_spy: "RSP/SPY",
      iwm_spy: "IWM/SPY",
      hyg: "HYG",
      jnk: "JNK",
      hy_spread: "高收益债利差",
      tnx: "10 年期美债",
      dxy: "美元指数",
      gold: "黄金"
    };

    function fmt(n, digits = 2) {
      if (n === null || n === undefined || Number.isNaN(n)) return "-";
      return Number(n).toLocaleString("en-US", {
        minimumFractionDigits: digits,
        maximumFractionDigits: digits
      });
    }

    function fmtDelta(n, suffix = "%") {
      if (n === null || n === undefined || Number.isNaN(n)) return "-";
      const cls = n > 0 ? "pos" : n < 0 ? "neg" : "";
      const sign = n > 0 ? "+" : "";
      return `<span class="${cls}">${sign}${fmt(n)}${suffix}</span>`;
    }

    function fmtDate(raw) {
      if (!raw) return "-";
      const d = new Date(raw);
      if (Number.isNaN(d.getTime())) return raw;
      return d.toLocaleString("zh-CN", { hour12: false });
    }

    function valueFor(key, item) {
      if (key === "tnx" || key === "hy_spread") return `${fmt(item.latest)}%`;
      if (key === "rsp_spy" || key === "iwm_spy") return fmt(item.latest, 4);
      if (key === "fear_greed") return fmt(item.latest, 1);
      return fmt(item.latest);
    }

    function oneDayFor(key, item) {
      if (key === "tnx" || key === "hy_spread") return fmtDelta(item.one_day_change, " 点");
      if (key === "fear_greed") return fmtDelta(item.one_day_change, " 点");
      return fmtDelta(item.one_day_pct, "%");
    }

    function fiveDayFor(key, item) {
      if (key === "tnx" || key === "hy_spread") return fmtDelta(item.five_day_change, " 点");
      if (key === "fear_greed") return fmtDelta(item.one_week_change, " 点/周");
      return fmtDelta(item.five_day_pct, "%");
    }

    function statusClass(item) {
      return item.status || "neutral";
    }

    function renderList(id, list) {
      const el = document.getElementById(id);
      if (!list || list.length === 0) {
        el.innerHTML = `<li class="muted">暂无</li>`;
        return;
      }
      el.innerHTML = list.map(x => `<li>${x}</li>`).join("");
    }

    function render(data) {
      const reading = data.reading || {};
      document.getElementById("regime").textContent = reading.regime || "数据不足";
      const tone = document.getElementById("tone");
      tone.className = `badge ${reading.tone || "neutral"}`;
      tone.textContent = reading.tone || "neutral";
      document.getElementById("action").textContent = reading.action || "等待数据。";
      document.getElementById("updated").textContent = `更新时间：${fmtDate(data.generated_at)}`;
      renderList("flags", reading.flags);
      renderList("positives", reading.positives);

      const metrics = data.metrics || {};
      const cards = document.getElementById("cards");
      cards.innerHTML = order.filter(k => metrics[k]).map(k => {
        const item = metrics[k];
        return `
          <article class="card">
            <h3>${labels[k] || item.name || k}</h3>
            <div class="value">${valueFor(k, item)}</div>
            <div class="delta">
              <span>1日 ${oneDayFor(k, item)}</span>
              <span>5日 ${fiveDayFor(k, item)}</span>
            </div>
            <div class="interp">${item.interpretation || ""}</div>
          </article>
        `;
      }).join("");

      const rows = document.getElementById("rows");
      rows.innerHTML = order.filter(k => metrics[k]).map(k => {
        const item = metrics[k];
        return `
          <tr>
            <td><strong>${item.name || labels[k] || k}</strong><br><span class="muted">${item.symbol || item.series || item.source || ""}</span></td>
            <td class="num">${valueFor(k, item)}</td>
            <td class="num">${oneDayFor(k, item)}</td>
            <td class="num">${fiveDayFor(k, item)}</td>
            <td><span class="badge ${statusClass(item)}">${item.interpretation || "参考趋势"}</span></td>
            <td class="muted">${item.source || "-"}<br>${fmtDate(item.date)}</td>
          </tr>
        `;
      }).join("");

      const error = document.getElementById("error");
      if (data.errors && data.errors.length) {
        error.style.display = "block";
        error.textContent = "部分数据源失败：" + data.errors.map(e => `${e.key}: ${e.error}`).join("；");
      } else {
        error.style.display = "none";
      }
    }

    async function load() {
      document.getElementById("refresh").disabled = true;
      try {
        let res;
        try {
          res = await fetch("/api/markets", { cache: "no-store" });
          if (!res.ok) throw new Error(await res.text());
        } catch (_) {
          res = await fetch("market_snapshot.json", { cache: "no-store" });
          if (!res.ok) throw new Error(await res.text());
        }
        render(await res.json());
      } catch (err) {
        const error = document.getElementById("error");
        error.style.display = "block";
        error.textContent = "刷新失败：" + err.message;
      } finally {
        document.getElementById("refresh").disabled = false;
      }
    }

    document.getElementById("refresh").addEventListener("click", load);
    load();
    setInterval(load, 5 * 60 * 1000);
  </script>
</body>
</html>
